apiVersion: v1
kind: Service
metadata:
  name: tienda-backend
  namespace: tienda
  annotations:
    # Esto le indica a AWS de forma obligatoria que cree un balanceador público y accesible por internet
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  selector:
    app: tienda-backend
